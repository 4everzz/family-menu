<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>小家菜单 · 电子菜单</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{--primary:#c0392b;--primary-dark:#a93226;--bg:#f5f5f5}

.header-right{display:flex;align-items:center;gap:8px}
.header-btn{background:rgba(255,255,255,0.1);border:none;color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;position:relative}
.header-btn:hover{background:rgba(255,255,255,0.2)}.header-btn .badge{position:absolute;top:-4px;right:-4px;background:var(--primary);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px}
.header-btn .badge.show{display:flex}.app-body{display:flex;height:100%;margin-top:0}
.left-panel{width:260px;min-width:260px;background:#fff;border-right:1px solid #e8e8e8;display:flex;flex-direction:column;overflow:hidden}

.left-panel-header .add-cat-btn{width:28px;height:28px;border-radius:6px;border:1px dashed #ccc;background:#fafafa;cursor:pointer;font-size:14px;display:none;align-items:center;justify-content:center;color:#999}
.left-panel.admin-mode .add-cat-btn{display:flex}.category-list{flex:1;overflow-y:auto;padding:4px 10px 12px}

.cat-item:hover{background:#f5f5f5;color:#333}.cat-item.active{background:var(--primary);color:#fff;font-weight:600}
.cat-item .cat-icon{font-size:17px;width:22px;text-align:center}.cat-item .cat-count{margin-left:auto;background:rgba(0,0,0,0.06);padding:1px 8px;border-radius:10px;font-size:11px}
.cat-item.active .cat-count{background:rgba(255,255,255,0.2)}.cat-item .cat-admin-edit{display:none;width:20px;height:20px;border:none;background:none;cursor:pointer;font-size:11px;opacity:0.5;align-items:center;justify-content:center;margin-left:2px}
.left-panel.admin-mode .cat-item .cat-admin-edit{display:flex}.mobile-sidebar-toggle{display:none}

.toolbar-btn{display:flex;align-items:center;gap:4px;padding:7px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.toolbar-btn-primary{background:var(--primary);color:#fff}.toolbar-btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.toolbar-btn-outline:hover{background:var(--primary);color:#fff}.toolbar-btn-success{background:#27ae60;color:#fff}
.admin-banner{display:none;padding:10px 24px;background:linear-gradient(135deg,#27ae60,#1e8449);color:#fff;font-size:13px;font-weight:600;align-items:center;flex-shrink:0}
.admin-banner.show{display:flex}.dish-list{flex:1;overflow-y:auto;padding:12px 24px 90px}
.dish-row{display:flex;align-items:stretch;gap:16px;background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.04);position:relative}
.dish-row:hover{box-shadow:0 3px 12px rgba(0,0,0,0.07)}

.dish-row-image img{width:100%;height:100%;object-fit:cover;display:block}.dish-row-image .img-placeholder{font-size:48px}

.dish-row.admin-mode .dish-row-image{cursor:pointer}.dish-row.admin-mode .img-edit-overlay{display:flex}

.dish-row-info .dri-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.dish-row-info .dri-price{font-size:22px;font-weight:800;color:var(--primary)}.dish-row-info .dri-price::before{content:"\A5";font-size:15px}
.dish-row-info .dri-actions{display:flex;align-items:center;gap:6px}
.dish-row-info .dri-actions .btn-add{width:40px;height:40px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.dish-row-info .dri-actions .btn-add:hover{background:var(--primary-dark)}
.dish-row-info .dri-actions .admin-act-btn{display:none;width:36px;height:36px;border-radius:50%;border:none;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#fff}
.dish-row.admin-mode .admin-act-btn{display:flex}.dish-row.admin-mode .btn-add{display:none}
.admin-act-btn-edit{background:#3498db}.admin-act-btn-delete{background:#e74c3c}
.dish-row-empty{text-align:center;padding:80px 20px;color:#aaa;font-size:14px}
.cart-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:150;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.15);display:none;align-items:center;padding:10px 20px;gap:12px;max-width:580px;width:calc(100% - 48px);border:1px solid #eee}.cart-bar.show{display:flex;animation:cartSlideUp 0.3s ease}@keyframes cartSlideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}.cb-checkout{padding:10px 24px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}.cb-checkout:hover{background:var(--primary-dark)}.cb-checkout:disabled{opacity:0.5;cursor:not-allowed}.cart-bar .cb-icon{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;flex-shrink:0}.cart-bar .cb-icon .cb-badge{position:absolute;top:-4px;right:-4px;background:#e74c3c;color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 3px}.cart-bar .cb-icon .cb-badge.show{display:flex}.cart-bar .cb-info{flex:1;min-width:0}.cart-bar .cb-info .cb-count{font-size:13px;color:#888}.cart-bar .cb-info .cb-total{font-size:18px;font-weight:800;color:var(--primary)}.cart-bar .cb-checkout{padding:10px 24px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}.cart-bar .cb-checkout:disabled{opacity:0.5;cursor:not-allowed}.cart-bar .cb-checkout:hover{box-shadow:0 4px 12px rgba(192,57,43,0.3)}.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:none}.cart-overlay.show{display:block}
.cart-drawer{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:#fff;z-index:201;display:flex;flex-direction:column;transition:right 0.3s;box-shadow:-4px 0 24px rgba(0,0,0,0.15)}
.cart-drawer.open{right:0}.cart-drawer-header{padding:20px 24px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cart-drawer-header h3{font-size:18px}.cart-drawer-header .cart-close-btn{width:32px;height:32px;border-radius:50%;border:none;background:#f0f0f0;cursor:pointer;font-size:16px}
.cart-drawer-items{flex:1;overflow-y:auto;padding:16px 24px}.cart-empty{text-align:center;padding:60px 0;color:#999}
.cart-empty .empty-icon{font-size:48px;margin-bottom:8px;display:block}.cart-empty p{font-size:14px}
.cart-drawer-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #f0f0f0}
.cart-drawer-item .cdi-img{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.cart-drawer-item .cdi-img img{width:100%;height:100%;object-fit:cover}.cart-drawer-item .cdi-info{flex:1;min-width:0}
.cart-drawer-item .cdi-name{font-size:14px;font-weight:600}.cart-drawer-item .cdi-price{font-size:13px;color:var(--primary);font-weight:600;margin-top:2px}
.cart-drawer-item .cdi-qty{display:flex;align-items:center;gap:6px}
.cart-drawer-item .cdi-qty button{width:26px;height:26px;border-radius:50%;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.cart-drawer-item .cdi-qty button:hover{border-color:var(--primary);color:var(--primary)}
.cart-drawer-item .cdi-qty .qty-num{font-size:15px;font-weight:600;min-width:20px;text-align:center}
.cart-drawer-item .cdi-total{font-size:14px;font-weight:700;color:var(--primary);min-width:56px;text-align:right}
.cart-drawer-item .cdi-remove{width:20px;height:20px;border:none;background:none;cursor:pointer;font-size:10px;color:#ccc;display:flex;align-items:center;justify-content:center}
.cart-drawer-item .cdi-remove:hover{color:#e74c3c}
.cart-footer{padding:16px 24px 24px;border-top:1px solid #e0e0e0;flex-shrink:0}
.cart-summary{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cart-summary .cs-label{font-size:14px;color:#888}.cart-summary .cs-total{font-size:24px;font-weight:800;color:var(--primary)}
.btn-checkout{width:100%;padding:14px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:1px}
.btn-checkout:hover{box-shadow:0 6px 16px rgba(192,57,43,0.3)}.btn-checkout:disabled{opacity:0.5;cursor:not-allowed}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;display:none}
.modal-overlay.show{display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;width:90%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 48px rgba(0,0,0,0.2);overflow:hidden}
.modal-header{padding:20px 24px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-header h3{font-size:18px;font-weight:700}.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:#f0f0f0;cursor:pointer;font-size:16px}
.modal-body{padding:24px;overflow-y:auto;flex:1}.modal-footer{padding:16px 24px;border-top:1px solid #e0e0e0;display:flex;justify-content:flex-end;gap:10px;flex-shrink:0}
.btn{padding:10px 22px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer}.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:#f0f0f0;color:#333}.btn-danger{background:#e74c3c;color:#fff}
.form-group{margin-bottom:16px}.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#333}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
.form-group textarea{resize:vertical;min-height:60px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.color-options{display:flex;gap:8px;flex-wrap:wrap}.color-options .color-swatch{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.color-options .color-swatch:hover{transform:scale(1.1)}.color-options .color-swatch.active{border-color:#333}
.image-upload-area{border:2px dashed #ddd;border-radius:8px;padding:20px;text-align:center;cursor:pointer;background:#fafafa;position:relative}
.image-upload-area:hover{border-color:var(--primary);background:#fff5f5}
.image-upload-area .upload-icon{font-size:36px;display:block;margin-bottom:6px}.image-upload-area .upload-text{font-size:13px;color:#999}
.image-upload-area .upload-text strong{color:var(--primary)}.image-upload-area img{max-width:100%;max-height:150px;border-radius:8px;display:block;margin:0 auto}
.image-upload-area .upload-clear{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,0.5);color:#fff;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.cart-remark{padding:0 0 12px}.cart-remark .cr-header{font-size:13px;font-weight:600;color:#555;margin-bottom:8px}.cart-remark .cr-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.cart-remark .cr-tag{padding:5px 12px;border-radius:16px;border:1.5px solid #ddd;background:#fafafa;font-size:12px;cursor:pointer;color:#666;user-select:none;transition:all 0.15s}.cart-remark .cr-tag:hover{border-color:var(--primary);color:var(--primary);background:#fff5f5}.cart-remark .cr-tag.active{background:var(--primary);color:#fff;border-color:var(--primary)}.cart-remark .cr-input{width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none;resize:none;font-family:inherit;box-sizing:border-box;background:#fafafa}.cart-remark .cr-input:focus{border-color:var(--primary);background:#fff}.order-remark{font-size:12px;color:#888;background:#f9f9f9;padding:6px 10px;border-radius:6px;margin-bottom:8px;line-height:1.4}.order-card{border:1px solid #e8e8e8;border-radius:12px;padding:16px;margin-bottom:14px}
.order-card .order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.order-card .order-id,.order-card .order-time{font-size:12px;color:#999}
.order-card .order-status{padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;background:#e8f5e9;color:#2e7d32}
.order-card .order-items{font-size:13px;color:#888;margin-bottom:8px}
.order-card .order-total{font-size:18px;font-weight:800;color:var(--primary);text-align:right}
.toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{padding:12px 24px;border-radius:8px;color:#fff;font-size:14px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,0.2);animation:ti 0.3s,to 0.3s 2.2s forwards;max-width:400px;text-align:center}
.toast.success{background:#2e7d32}.toast.error{background:#c0392b}.toast.info{background:#1565c0}
@keyframes ti{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes to{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(20px)}}
@media(max-width:900px){
.left-panel{position:fixed;left:-280px;top:64px;bottom:0;z-index:150}.left-panel.open{left:0}.mobile-sidebar-toggle{display:flex!important}
.cart-drawer{width:100%;right:-100%}.dish-list{padding:12px 16px 100px}.content-toolbar{padding:12px 16px}
.header-center{max-width:160px;margin:0 8px}.header-logo h1{font-size:16px}.dish-row-image{width:100px;min-width:100px;height:100px}
.dish-row-info .dri-name{font-size:16px}.dish-row-info .dri-price{font-size:19px}

@media(max-width:480px){

.dish-row-info .dri-name{font-size:15px}.dish-row-info .dri-desc{font-size:12px}.dish-row-info .dri-price{font-size:17px}
.dish-row-info .dri-actions .btn-add{width:34px;height:34px;font-size:18px}.dish-list{padding:10px 12px 100px}
.content-toolbar{padding:10px 12px;flex-direction:column}
}
.pages{position:relative;overflow:hidden;flex:1}.page{display:none;height:100%;overflow-y:auto}.page.active{display:flex;flex-direction:column}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:140;background:#fff;border-top:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-around;height:56px;padding-bottom:env(safe-area-inset-bottom)}.bottom-nav .nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;cursor:pointer;border:none;background:none;color:#999;font-size:11px;transition:color 0.2s;user-select:none;min-width:60px}.bottom-nav .nav-item .nav-icon{font-size:20px;line-height:1;margin-bottom:1px}.bottom-nav .nav-item.active{color:var(--primary);font-weight:600}.bottom-nav .nav-item:hover{color:var(--primary)}.waiting-card{text-align:center;padding:40px 24px;background:#fff;border-radius:16px;margin:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}.waiting-card .pickup-code{font-size:48px;font-weight:800;letter-spacing:8px;color:var(--primary);margin:20px 0;font-family:monospace}.waiting-card .status-text{font-size:18px;font-weight:600;color:#333;margin:12px 0}.waiting-card .status-icon{font-size:48px;display:block;margin-bottom:8px}.timer-settings{margin:20px auto;max-width:300px;padding:16px;background:#f9f9f9;border-radius:12px;text-align:left}.timer-settings label{font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:6px}.timer-settings input[type=number]{width:100%;padding:8px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box}.timer-settings input[type=number]:focus{border-color:var(--primary)}.no-order{text-align:center;padding:60px 20px;color:#aaa}.no-order .no-icon{font-size:48px;display:block;margin-bottom:12px}.no-order p{font-size:14px}.page-orders{padding:16px 24px}.cart-bar{z-index:160!important}</style></head>
<body>
<header class="header">
<div class="header-left"><button class="mobile-sidebar-toggle" id="sidebarToggle">☰</button><div class="header-logo"><span class="logo-icon">🍜</span><div><h1>小家菜单</h1><div class="subtitle">MEIWEIXUAN · 品质中餐</div></div></div></div>
<div class="header-center"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="搜索菜品名称..." autocomplete="off" /></div>
<div class="header-right"><button class="header-btn" id="orderHistoryBtn">📋</button><button class="header-btn" id="cartBtn">🛒<span class="badge" id="cartBadge">0</span></button></div>
</header>
<div class="pages"><div class="page active" id="pageOrder"><div class="app-body">
<aside class="left-panel" id="leftPanel"><div class="left-panel-header"><span>📂 菜品分类</span><button class="add-cat-btn" id="addCategoryBtn">+</button></div><div class="category-list" id="categoryList"></div></aside>
<main class="right-content">

function odm(did){document.getElementById('dishEditTitle').textContent=did?'编辑菜品':'添加菜品';const cs=document.getElementById('editDishCategory');cs.innerHTML=S.categories.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('');const d=did?fd(did):null;S.editDish=did||null;document.getElementById('editDishName').value=d?d.name:'';document.getElementById('editDishPrice').value=d?d.price:'';document.getElementById('editDishDesc').value=d?(d.desc||''):'';document.getElementById('editDishEmoji').value=d?(d.emoji||'🍽️'):'🍽️';document.getElementById('editDishCategory').value=d?d.category:(S.categories[0]?.id||'');const pv=document.getElementById('uploadPreview'),ui=document.getElementById('uploadIcon'),ut=document.getElementById('uploadText'),cb=document.getElementById('uploadClear');if(d&&d.image&&d.image.length>100){pv.src=d.image;pv.style.display='block';ui.style.display='none';ut.textContent='点击更换图片';cb.style.display='flex'}else{pv.style.display='none';ui.style.display='block';ut.innerHTML='点击 <strong>上传图片</strong>，支持 JPG / PNG';cb.style.display='none'}hc(d?(d.color||CS[0]):CS[0]);document.getElementById('dishEditModal').classList.add('show')}

function showToast(m,t){const c=document.getElementById('toastContainer'),o=document.createElement('div');o.className='toast '+(t||'info');o.textContent=m;c.appendChild(o);setTimeout(()=>o.remove(),2500)}let wt=null;function sw(p){document.querySelectorAll('.page').forEach(function(el){el.classList.remove('active')});document.getElementById(p).classList.add('active')}function gpc(){var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code='',i;for(i=0;i<4;i++)code+=chars[Math.floor(Math.random()*chars.length)];return code}function swa(){var o=S.orders[0];if(!o){document.getElementById('waitingIcon').textContent='\u23f3';document.getElementById('pickupCode').textContent='---';document.getElementById('waitingStatus').textContent='\u6682\u65e0\u8fdb\u884c\u4e2d\u7684\u8ba2\u5355';document.getElementById('waitingDetail').textContent='';if(wt){clearTimeout(wt);wt=null}return}var sd=localStorage.getItem('mx_waiting'),remaining=0;if(sd){try{var d=JSON.parse(sd);if(d.orderId===o.id){var elapsed=(Date.now()-d.startTime)/60000;remaining=Math.max(0,d.duration-elapsed)}else{localStorage.removeItem('mx_waiting')}}catch(e){localStorage.removeItem('mx_waiting')}}if(remaining<=0){document.getElementById('waitingIcon').textContent='\u2705';document.getElementById('pickupCode').textContent=o.pickup||'---';document.getElementById('waitingStatus').textContent='\u9910\u54c1\u5236\u4f5c\u5b8c\u6210\uff0c\u8bf7\u7acb\u5373\u53d6\u9910';document.getElementById('waitingDetail').textContent='\u53d6\u9910\u7801: '+(o.pickup||'---')+' | \u8ba2\u5355\u7f16\u53f7: '+o.id;if(wt){clearTimeout(wt);wt=null}}else{document.getElementById('waitingIcon').textContent='\u23f3';document.getElementById('pickupCode').textContent=o.pickup||'---';document.getElementById('waitingStatus').textContent='\u9910\u54c1\u5236\u4f5c\u4e2d\uff0c\u8bf7\u7a0d\u7b49...';document.getElementById('waitingDetail').textContent='\u53d6\u9910\u7801: '+(o.pickup||'---')+' | \u5269\u4f59: '+Math.ceil(remaining)+'\u5206\u949f';if(wt)clearTimeout(wt);wt=setTimeout(swa,remaining*60000)}}function init(){try{localStorage.removeItem('menu_data')}catch(e){}ld();const cc=document.getElementById('colorOptions');cc.innerHTML=CS.map(c=>'<div class="color-swatch" data-color="'+c+'" style="background:'+c+'"></div>').join('');cc.querySelectorAll('.color-swatch').forEach(el=>el.addEventListener('click',()=>hc(el.dataset.color)));hc(CS[0]);ra();const rmt=document.getElementById('remarkTags');if(rmt){['\u5c11\u5403\u8fa3','\u7231\u5403\u8fa3','\u4e0d\u5403\u9999\u83dc','\u5c11\u6cb9','\u5c11\u76d0','\u4e0d\u8981\u8471','\u52a0\u6025'].forEach(t=>{const el=document.createElement('span');el.className='cr-tag';el.textContent=t;el.addEventListener('click',()=>{const inp=document.getElementById('remarkInput');const txt=t;if(el.classList.contains('active')){el.classList.remove('active');const tags=inp.value.split('\uff1b').filter(x=>x.trim()&&x.trim()!==txt);inp.value=tags.join('\uff1b')}else{el.classList.add('active');const existing=inp.value.trim();inp.value=existing?(existing+'\uff1b'+txt):txt}inp.value=inp.value.trim()})});document.querySelectorAll('.bottom-nav .nav-item').forEach(function(el){el.addEventListener('click',function(){sw(el.dataset.page);if(el.dataset.page==='pageWaiting')swa();if(el.dataset.page==='pageOrders'){var el2=document.getElementById('orderListInline');if(el2){var h=S.orders.map(function(o){return '<div class="order-card"><div class="order-header"><span class="order-id">&#128196; '+o.id+'</span><span class="order-time">'+o.time+'</span><span class="order-status">&#24050;&#23436;&#25104;</span></div><div class="order-items">'+o.items.map(function(i){return i.name+'&#215;'+i.qty}).join('&#12289;')+'</div>'+(o.remark?'<div class="order-remark">&#128172; &#22791;&#27880;: '+o.remark+'</div>':'')+(o.pickup?'<div style="font-size:12px;color:#999;margin-bottom:8px">&#128203; &#21462;&#39184;&#30721;: '+o.pickup+'</div>':'')+'<div class="order-total">'+fp(o.total)+'</div></div>'}).join('');el2.innerHTML=h||'<div class="no-order"><span class="no-icon" style="font-size:48px;display:block;margin-bottom:12px">&#128203;</span><p>&#26242;&#26080;&#21382;&#21490;&#35746;&#21333;</p></div>'}}}})});document.getElementById('sidebarToggle').addEventListener('click',()=>{document.getElementById('leftPanel').classList.toggle('open')});var _rc=document.querySelector('.right-content');if(_rc)_rc.addEventListener('click',()=>{document.getElementById('leftPanel').classList.remove('open')})}}
