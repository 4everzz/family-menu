# ==================== Alembic configuration ====================
# Only the migration tool's own settings live here.
# The database URL is intentionally NOT stored in this file: alembic/env.py
# reads it from .env, so no password ever appears in a file that may be committed.
#
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale
# encoding (GBK on a Chinese Windows), so non-ASCII bytes make it fail to parse.

[alembic]
# Directory holding migration scripts
script_location = alembic

# Migration filename pattern (time-prefixed so they sort chronologically)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use local time in filenames so they line up with the local clock
timezone = Asia/Shanghai


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
